<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gang Box List</title>
  <meta name="theme-color" content="#0A2647">
  <meta name="description" content="Check off tools for the gang box and send the list to the warehouse.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gang Box">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">AE</div>
      <div class="brand-name">
        <span id="brandName">Action Electrical &amp; Mechanical</span>
        <h1 id="title">Gang Box List</h1>
      </div>
      <button id="menuBtn" class="topbar-btn" type="button" aria-label="More options">⋮</button>
    </div>
  </header>
  <div class="stripe" aria-hidden="true"></div>

  <main id="main">
    <div id="installTip" class="tip" hidden>
      <div class="tip-text" id="installTipText"></div>
      <div class="tip-actions">
        <button id="installBtn" class="btn btn-primary" type="button" hidden>Add to Home Screen</button>
        <button id="installDismiss" class="btn btn-plain" type="button">Not now</button>
      </div>
    </div>

    <section class="card" aria-labelledby="jobHeading">
      <h2 id="jobHeading"><span class="step">1</span>Job info</h2>
      <div id="jobLink" class="tip joblink" hidden></div>
      <label class="field">
        <span>Job number</span>
        <input id="jobNumber" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="Example: 24-118">
      </label>
      <label class="field">
        <span>Job name</span>
        <input id="jobName" type="text" autocomplete="off" autocapitalize="words" placeholder="Example: Smith Residence">
      </label>
      <label class="field">
        <span>Job address</span>
        <input id="jobAddress" type="text" autocomplete="off" autocapitalize="words" placeholder="Example: 123 Main St, Madison">
      </label>
      <label class="field">
        <span>Your name</span>
        <input id="requestedBy" type="text" autocomplete="name" autocapitalize="words" placeholder="Example: Mike">
      </label>
      <label class="field">
        <span>Date needed</span>
        <input id="dateNeeded" type="date">
      </label>
      <div class="field">
        <span>Send it in (pick one or both)</span>
        <div class="choose-opts" id="containerOpts">
          <button type="button" class="opt opt-big" data-val="Gang box">Gang box</button>
          <button type="button" class="opt opt-big" data-val="Clam shell">Clam shell</button>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="toolsHeading">
      <h2 id="toolsHeading"><span class="step">2</span>Tap the tools you need</h2>
      <div class="search">
        <input id="search" type="search" placeholder="🔍 Search tools" autocomplete="off">
      </div>
      <div id="toolList"></div>
      <button id="addToolBtn" class="btn btn-outline btn-wide" type="button">＋ Add a tool that's not listed</button>
    </section>

    <div class="bottom-space"></div>
  </main>

  <footer class="sendbar">
    <div id="countText" class="count">No tools picked yet</div>
    <button id="sendBtn" class="btn btn-primary btn-send" type="button" disabled><span class="step step-light">3</span>Send to warehouse</button>
  </footer>

  <!-- Pop-up windows -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalActions" class="modal-actions"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js?v=14"></script>
  <script src="tools.js?v=14"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
