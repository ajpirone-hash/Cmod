name: Gang Box Android app

on:
  push:
    paths:
      - "gangbox-app/**"
      - ".github/workflows/gangbox-android.yml"
  pull_request:
    paths:
      - "gangbox-app/**"
      - ".github/workflows/gangbox-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gangbox-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build app
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GangBox.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GangBox-apk
          path: gangbox-app/GangBox.apk

      # On the repo's default branch, also post the APK as a GitHub Release so it can be
      # downloaded straight to a phone from the repo's Releases page.
      - name: Publish release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gangbox-v1.0.${{ github.run_number }}
          name: Gang Box app 1.0.${{ github.run_number }}
          body: Download GangBox.apk on an Android phone and open it to install.
          files: gangbox-app/GangBox.apk
